name: Keep Render backend awake

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 min idle)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" "https://little-polyglot-backend.onrender.com/api/health")
          echo "HTTP status: $STATUS"
          cat /tmp/response.json
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "Ping successful (service is awake or waking up)."
          else
            echo "Ping failed with status $STATUS"
            exit 1
          fi
